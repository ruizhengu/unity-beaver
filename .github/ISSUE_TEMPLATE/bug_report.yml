name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The `doctor` output below usually tells us most of what we need.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `unity-beaver doctor`
      description: Run it from your Unity project folder and paste the result.
      render: text
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `unity-beaver check` (if relevant)
      render: text
  - type: input
    id: agent
    attributes:
      label: AI agent
      placeholder: Claude Code, Codex, Cursor, …
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Windows 11, Ubuntu 24.04, …
